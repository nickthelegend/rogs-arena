[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
# Size-optimized: a devnet upgrade must fund a buffer as large as the whole program (~5 µSOL/byte).
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
